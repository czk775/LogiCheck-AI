function loadAccount(email){state.account=email;safeSessionSet('logicheck_account',email);try{const raw=safeLocalGet(DB_KEY+email);state.shipments=raw?JSON.parse(raw):[sampleShipment()];}catch{state.shipments=[sampleShipment()]}save();state.screen='list';state.activeId=null;state.modal=null;state.drawer=null;render();}
function shipment(){return state.shipments.find(s=>s.id===state.activeId)}
function addActivity(s,text){s.activities.unshift({text,at:time()});s.updatedAt=time();save();}
function badge(label,kind='neutral'){return `<span class="chip ${kind}"><span class="chipdot"></span><span>${esc(label)}</span></span>`}
function btn(act,text,extra='',iconName=null){return `<button type="button" class="btn ${extra}" data-act="${act}">${iconName?ic(iconName):''}${text}</button>`}
function docStatus(d){if(d.status==='complete')return badge(d.demo?'已解析 · 演示':'已解析','good');if(d.status==='processing')return badge('上传处理中','info');if(d.status==='failed')return badge('上传失败','danger');return badge('待真实 AI 解析','warn')}
function statusShip(s){if(!s.docs.length)return 'draft';if(!s.demo)return s.docs.some(d=>d.status==='processing')?'processing':'awaiting';if(s.docs.some(d=>d.status==='processing'))return 'processing';let pending=s.findings.filter(f=>f.status!=='resolved').length;if(pending)return 'needs_review';return s.docs.some(d=>d.status!=='complete')?'incomplete':'complete';}
function countIssues(s){return s.findings.filter(f=>f.status!=='resolved').length}
function makeBrand(){return `<div class="brand"><div class="brand-mark">${ic('package','lg')}</div><div><div class="brand-word">LogiCheck <span style="color:#67dce2">AI</span></div><small>SHIPMENT INTELLIGENCE</small></div></div>`}
function sidebar(){return `<aside class="sidebar">${makeBrand()}<div class="nav-label">WORKSPACE</div><button class="nav-link ${state.screen==='list'?'active':''}" data-act="list">${ic('grid')}<span>货物管理</span></button><button class="nav-link ${state.screen==='workspace'?'active':''}" data-act="workspace-nav">${ic('package')}<span>货物工作台</span></button><button class="nav-link" data-act="guide">${ic('clipboard')}<span>体验指南</span></button><div class="sidebar-bottom"><div class="sys-card"><strong><span class="pulse-dot"></span>原型体验环境</strong><p>所有 AI 提取结果为明确标注的演示数据。上传真实文件仅做本地预览。</p></div><button class="account" data-act="logout" title="退出当前演示账号"><div class="avatar">${esc((state.account||'D')[0].toUpperCase())}</div><div class="account-meta"><strong>${esc(state.account)}</strong><span>演示账号 · 点击退出</span></div>${ic('logout','sm')}</button></div></aside>`}
function themeToggleButton(){const light=themeMode()==='light';return `<button type="button" class="theme-toggle" data-act="toggle-theme" aria-label="切换到${light?'深色':'浅色'}主题" title="切换到${light?'深色':'浅色'}主题" aria-pressed="${light}">${ic(light?'moon':'sun','sm')}<span>${light?'浅色模式':'深色模式'}</span><span class="theme-switch" aria-hidden="true"><span></span></span></button>`}
function topbar(){return `<header class="topbar"><div class="crumb"><span>工作空间</span><span class="sep">/</span><span>${state.screen==='list'?'货物管理':'货物工作台'}</span></div><div class="top-right"><span class="env-badge">● INTERACTIVE PROTOTYPE</span>${themeToggleButton()}<button class="top-action" data-act="guide" title="体验指南">${ic('help')}</button></div></header>`}
function auth(){return `<main class="auth-screen"><div class="auth-story">${makeBrand()}<div class="eyebrow" style="margin-bottom:17px">THE NEW STANDARD IN DOCUMENT OPERATIONS</div><h1>让每一票货物<br/><em>清晰可控。</em></h1><p>从单证理解、跨文件核验到目的国合规预检，把繁杂的物流单证工作组织成值得信赖的异常处理流程。</p><div class="auth-features"><span>◈ 一票货物，全局掌控</span><span>◈ 证据驱动的核验</span><span>◈ 异常处理闭环</span></div></div><section class="auth-card"><div class="auth-theme-row">${themeToggleButton()}</div><div class="eyebrow" style="margin-bottom:14px">SECURE WORKSPACE · PROTOTYPE</div><h2>${state.authMode==='register'?'创建体验账号':'欢迎回来'}</h2><p class="intro">${state.authMode==='register'?'创建一个仅用于本机体验的原型身份。':'登录并继续处理你的货物和单证。'}</p><form id="authForm"><div class="form-row"><label for="email">邮箱地址</label><input class="field" id="email" type="email" required autocomplete="email" placeholder="name@company.com"/></div><div class="form-row"><label for="password">密码</label><input class="field" id="password" type="password" required minlength="4" placeholder="原型演示，不要输入真实密码" autocomplete="off"/></div><div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 23px"><span style="font-size:11px;color:#7994a8">仅界面演示 · 不进行真实身份认证</span><button type="button" class="text-btn" data-act="forgot">忘记密码？</button></div><button type="submit" class="btn primary" style="width:100%">${state.authMode==='register'?'创建体验身份':'进入工作空间'} ${ic('arrow')}</button></form><div style="display:flex;align-items:center;gap:14px;margin:23px 0"><div style="flex:1;height:1px;background:#304357"></div><span style="color:#718ba0;font-size:10px">或</span><div style="flex:1;height:1px;background:#304357"></div></div>${btn('demo-login','一键体验演示案例','', 'sparkle')}<div style="text-align:center;margin-top:25px;font-size:12px;color:#9db5c7">${state.authMode==='register'?'已有体验身份？':'还没有体验身份？'} <button class="text-btn" data-act="toggle-auth">${state.authMode==='register'?'返回登录':'注册体验账号'}</button></div><div class="auth-note">${ic('info','sm')} 此为单文件高保真原型。身份与权限在此均未接入服务器，请勿输入真实密码或敏感商业文件。</div></section></main>`}
function listPage(){const count=state.shipments.length;return `<section class="page"><div class="page-head"><div><div class="eyebrow">SHIPMENT OPERATIONS</div><h1>货物管理</h1><p class="page-sub">管理每一票货物的单证、预检进度与待办事项。</p></div><div class="actions">${btn('new-shipment','新建货物','primary','plus')}</div></div><div class="hero"><div><div class="eyebrow" style="margin-bottom:8px">SHIPMENT CONTROL CENTER</div><strong>所有单证，一处掌控。</strong><p>上传单证后自动进入预检流程；问题集中呈现，证据随时可查，处理结果可追溯。</p></div><div class="hero-symbol">${ic('activity','xl')}</div></div><div class="section-title"><h2>全部货物 <span style="color:#7a94a8;font-size:11px;font-weight:500;margin-left:7px">${count} 票</span></h2><span class="section-hint">数据仅保存在当前浏览器的原型存储中</span></div><div class="toolbar"><div class="search-box">${ic('search')}<input id="search" placeholder="搜索货物编号或产品名称..." value="${esc(state.search)}" aria-label="搜索货物"/></div><select id="statusFilter" class="field select" aria-label="筛选货物状态"><option value="all" ${state.filter==='all'?'selected':''}>全部状态</option><option value="draft" ${state.filter==='draft'?'selected':''}>待上传</option><option value="needs_review" ${state.filter==='needs_review'?'selected':''}>待处理异常</option><option value="awaiting" ${state.filter==='awaiting'?'selected':''}>待接入 AI</option><option value="complete" ${state.filter==='complete'?'selected':''}>检查完成</option></select></div><div class="table-wrap"><table class="ship-table"><thead><tr><th>货物信息</th><th>贸易路线</th><th>单证数量</th><th>预检状态</th><th>更新时间</th><th style="text-align:right">操作</th></tr></thead><tbody id="shipRows">${renderRows()}</tbody></table></div><div class="footer-note">${esc(IS_DEMO_NOTICE)}</div></section>`}
function renderRows(){const query=state.search.trim().toLowerCase();const list=state.shipments.filter(s=>(!query||[s.name,s.id].some(v=>String(v).toLowerCase().includes(query)))&&(state.filter==='all'||statusShip(s)===state.filter));if(!list.length)return `<tr><td colspan="6">${state.shipments.length?empty('search','没有找到匹配的货物','尝试调整搜索词或筛选条件。',false):empty('package','还没有货物','新建第一票货物，然后上传单证即可开始。',true)}</td></tr>`;return list.map(s=>`<tr><td><div class="ship-title">${esc(s.name||'未命名货物')} ${s.demo?'<span style="color:#6bc8ce;font-size:10px;margin-left:5px">· 演示</span>':''}</div><div class="ship-sub">${esc(s.id)}</div></td><td>${esc(s.origin)} → ${esc(s.destination)}</td><td>${s.docs.length} 份</td><td>${badge(...statusMeta[statusShip(s)])}</td><td style="color:#8ba5b8">${formatTime(s.updatedAt)}</td><td><div class="row-actions"><button class="link-btn" data-act="open-shipment" data-id="${esc(s.id)}">进入工作台 ${ic('arrowup','sm')}</button><div class="menu-anchor"><button class="more-btn" data-act="toggle-menu" data-id="${esc(s.id)}" title="更多操作">${ic('dots')}</button>${state.menu===s.id?`<div class="popover-menu"><button data-act="open-shipment" data-id="${esc(s.id)}">进入工作台</button><button class="warned" data-act="ask-delete" data-id="${esc(s.id)}">删除货物</button></div>`:''}</div></div></td></tr>`).join('')}
function empty(icon,title,desc,action){return `<div class="empty"><div class="empty-icon">${ic(icon,'xl')}</div><h3>${title}</h3><p>${desc}</p>${action?btn('new-shipment','新建货物','primary','plus'):''}</div>`}
function getProfileValue(s,k){return s.profile[k]??'—'}
const fieldLabels={product:'产品名称',model:'产品型号',quantity:'货物数量',origin:'起运国',destination:'目的国',hs:'申报 HS 编码',gross:'毛重',battery:'电池属性',unit:'计量单位',cartons:'箱数'};
function sectionTitle(name,actionLabel='',action=''){return `<div class="section-title"><h2>${name}</h2>${action?`<button class="section-link" data-act="${action}">${actionLabel} ${ic('arrow','sm')}</button>`:''}</div>`}
function docCard(s,d){return `<div class="sub-row"><div class="doc-icon">${ic(d.format==='edi'?'clipboard':'file')}</div><div class="doc-info"><strong>${esc(d.fileName)}</strong><span>${esc(d.type||'待识别单证类型')} · ${d.demo?'演示来源':'用户本地文件'} ${d.error?' · '+esc(d.error):''}</span></div><div class="doc-actions">${docStatus(d)} <button class="link-btn" data-act="preview-doc" data-id="${esc(d.id)}" title="预览文件">${ic('eye','sm')}</button>${d.status==='failed'?`<button class="link-btn" data-act="retry-file" data-id="${esc(d.id)}">重试</button>`:''}<button class="link-btn" data-act="ask-delete-doc" data-id="${esc(d.id)}" title="移除单证">${ic('trash','sm')}</button></div></div>`}
function workspace(){const s=shipment();if(!s){state.screen='list';return listPage()};const status=statusShip(s);const issueCount=countIssues(s);const hasDocs=s.docs.length>0;const processing=s.docs.some(d=>d.status==='processing');const userOnly=!s.demo;const statusText=!hasDocs?'上传第一份单证，开始预检':userOnly?'文件已接收，待接入真实 AI':issueCount>0?'发现需要关注的异常':s.dirty?'已修改资料，等待重新检查':'当前演示检查项已完成';const nextDesc=!hasDocs?'支持多文件上传、批量添加，AI 工作流将在后端接入后真正运行。':userOnly?'原型已保留上传文件，可查看原件。真实内容提取、核验和合规结果需后端服务接入。':issueCount?'请先处理数量冲突或缺失的合规材料，再重新检查。':'可以继续补充单证，或查看已保存的检查记录。';return `<section class="page"><button class="backlink" data-act="list">${ic('left','sm')} 返回货物列表</button><div class="workspace-head"><div><div class="eyebrow">SHIPMENT / ${esc(s.id)}</div><h1 class="workspace-title">${esc(s.name)}</h1><div class="workspace-meta"><span>${esc(s.origin)} → ${esc(s.destination)}</span><span class="dotsep"></span><span>${s.demo?'演示场景':'用户创建'}</span><span class="dotsep"></span><span>更新于 ${formatTime(s.updatedAt)}</span></div></div><div class="actions">${btn('upload','补充单证','','plus')}${btn('recheck','重新检查','primary','refresh')}</div></div><div class="workspace-hero"><div class="glass-panel status-panel"><div class="eyebrow">OVERALL PRE-CHECK STATUS</div><h2>${statusText}</h2><p>${!hasDocs?'从第一份单证开始，逐步建立完整货物资料。':userOnly?'本原型不伪造上传文件的 AI 解析结果。文件已在浏览器端保存，未来将由真实 AI API 进行理解和核验。':issueCount?`当前有 ${issueCount} 项待处理问题。点击异常，可回溯来源单证并进行人工复核。`:'已完成当前演示核验。材料存在不代表具备法定合规结论。'}</p><div class="status-line">${ic(status==='needs_review'?'alert':status==='draft'?'cloud':'activity')} ${badge(...statusMeta[status])} <span>${s.dirty?'资料已改变，建议重新检查':'基于当前货物资料'}</span></div></div><div class="glass-panel next-panel"><div class="top-mini">${ic('bolt')} 下一步建议</div><div><h3>${!hasDocs?'上传这票货物的单证':userOnly?'查看文件并等待真实解析服务':issueCount?'优先处理待办异常':'继续管理单证与货物资料'}</h3><p>${nextDesc}</p></div>${btn(!hasDocs?'upload':userOnly?'guide':issueCount?'open-first-issue':'activity',!hasDocs?'上传单证':userOnly?'查看原型使用说明':issueCount?'查看第一个异常':'查看处理记录','','arrow')}</div></div><div class="metrics"><button class="metric" data-act="go-docs"><div class="m-top">已上传单证 ${ic('file')}</div><strong>${s.docs.length.toString().padStart(2,'0')}</strong><small>支持继续补充文件</small></button><button class="metric" data-act="go-issues"><div class="m-top">待处理异常 ${ic('alert')}</div><strong style="color:${issueCount?'#efa3a8':'#e7f1f9'}">${issueCount.toString().padStart(2,'0')}</strong><small>集中查看及修正</small></button><button class="metric" data-act="go-profile"><div class="m-top">货物字段 ${ic('package')}</div><strong>${Object.values(s.profile).filter(Boolean).length.toString().padStart(2,'0')}</strong><small>${s.demo?'AI 字段结果（演示）':'尚未提取'}</small></button><button class="metric" data-act="go-rules"><div class="m-top">合规规则 ${ic('shield')}</div><strong>${s.demo?'05':'—'}</strong><small>${s.demo?'有限规则演示集':'等待规则执行'}</small></button></div><div class="grid-work"><div class="work-col"><section id="issues" class="glass-panel section-card">${sectionTitle('待处理异常','处理记录','activity')}${s.demo?issueList(s):empty('checkcircle',s.docs.length?'暂无待处理异常':'等待单证上传',s.docs.length?'当前演示异常已处理，查看历史记录了解变更。':'添加单证后，异常会在预检完成后集中显示。',false)}</section><section id="docs" class="glass-panel section-card">${sectionTitle('单证管理','添加单证','upload')}${hasDocs?s.docs.map(d=>docCard(s,d)).join(''):uploadZone()}${hasDocs?`<div style="margin-top:17px">${uploadZone()}</div>`:''}${processing?`<div style="margin-top:13px">${ic('activity','sm')} <span style="color:#9ec6d5;font-size:11px">正在模拟上传反馈...</span><div class="shimmer" style="margin-top:10px"></div></div>`:''}</section><section id="profile" class="glass-panel section-card">${sectionTitle('货物信息','查看完整字段','full-profile')}${s.demo?`<div class="profile-items">${['product','model','quantity','origin','destination','hs'].map(k=>`<div class="profile-item"><label>${fieldLabels[k]}</label><div class="pvalue">${esc(getProfileValue(s,k))} ${k==='quantity'&&s.profile.quantity.includes('冲突')?'<span class="tagtiny">需复核</span>':''}</div><button class="section-link" data-act="edit-field" data-key="${k}">查看 / 编辑 ${ic('chevron','sm')}</button></div>`).join('')}</div>`:empty('brain','暂无 AI 提取字段','上传真实文件后，需接入 AI 才能生成可验证的货物信息。',false)}</section></div><div class="work-col"><section id="rules" class="glass-panel section-card">${sectionTitle('德国 / 欧盟合规预检','规则说明','rule-help')}${s.demo?ruleList(s):empty('shield','等待合规规则执行','当前文件尚未经过真实 AI 提取，无法做出有效的合规材料判断。',false)}<div class="prototype-note" style="margin-top:20px">${ic('info','sm')} 合规检查是资料完整性与风险提示，不构成法律意见或海关放行结论。</div></section><section class="glass-panel section-card">${sectionTitle('处理流程','查看记录','activity')}${workflow(s)}</section></div></div><div class="foot-disclaimer">${esc(IS_DEMO_NOTICE)}。上传的真实文件不会被发送到云端；浏览器本地文件缓存不属于生产级数据安全方案。</div></section>`}
function uploadZone(){return `<div class="upload-zone" data-act="upload" role="button" tabindex="0">${ic('cloud','xl')}<strong>拖拽文件到这里，或点击上传</strong><span>PDF · JPG / PNG · EDIFACT (EDI / TXT) · 可多选</span></div>`}
function issueList(s){const ff=s.findings.filter(f=>f.status!=='resolved');if(!ff.length)return `<div class="empty" style="padding:24px"><div class="empty-icon">${ic('checkcircle','lg')}</div><h3>暂无未解决异常</h3><p>已解决事项保留在处理记录中。</p></div>`;return `<div class="issue-list">${ff.map(f=>`<button class="issue-item" data-act="open-issue" data-id="${esc(f.id)}"><div class="issue-icon ${f.severity==='warn'?'warn':''}">${ic(f.severity==='danger'?'alert':'info')}</div><div class="issue-copy"><strong>${esc(f.title)}</strong><small>${esc(f.summary)}</small></div>${badge(f.status==='reviewed'?'人工已复核':f.status==='reviewing'?'复核中':'待处理',f.status==='reviewed'?'info':f.severity==='danger'?'danger':'warn')}${ic('chevron','sm')}</button>`).join('')}</div>`}
function ruleList(s){const hasDoc=(part)=>s.docs.some(d=>d.fileName.toLowerCase().includes(part));const items=[['red',hasDoc('doc')?'已收到待复核':'待补充证据',hasDoc('doc')?'warn':'danger'],['rohs',hasDoc('rohs')?'材料已提供':'待补充证据',hasDoc('rohs')?'good':'warn'],['battery','证据不足','warn'],['weee','适用性待确认','neutral'],['hs','需人工核查','warn']];return `<div>${items.map(([k,label,kind])=>`<button class="rule-row" data-act="rule" data-rule="${k}" style="width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit;cursor:pointer"><div class="rule-symbol">${ic(k==='hs'?'filter':'shield','sm')}</div><div class="rule-text"><strong>${ruleNames[k]}</strong><small>${esc(ruleDetails[k].category)}</small></div>${badge(label,kind)}${ic('chevron','sm')}</button>`).join('')}</div>`}
function workflow(s){const docs=s.docs;const isDemo=s.demo;const stages=[['单证上传',docs.length?`${docs.length} 份已添加`:'等待上传',docs.length?'done':'todo'],['单证理解',isDemo?'已载入演示提取字段':'等待真实 AI 服务',isDemo?'done':'todo'],['跨单证核验',isDemo?'已运行演示规则':'等待真实字段',isDemo?'done':'todo'],['目的国合规预检',isDemo?'演示规则集已检查':'尚未检查',isDemo?'done':'todo'],['人工复核 / 重新检查',isDemo&&countIssues(s)?`${countIssues(s)} 项需要关注`:isDemo?'已完成当前演示检查':'等待检查结果',isDemo&&countIssues(s)?'active':'todo']];return `<div class="workflow-items">${stages.map(([name,desc,kind])=>`<div class="wf-item"><span class="wf-circle ${kind}">${ic(kind==='done'?'check':kind==='active'?'activity':'clock','sm')}</span><div class="wf-copy"><strong>${name}</strong><span>${esc(desc)}</span></div></div>`).join('')}</div>`}
function modalShell(title,content,actions=''){return `<div class="overlay" data-act="close-overlay"></div><div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialog-header"><h2>${esc(title)}</h2><button class="close" data-act="close-modal" title="关闭">${ic('x')}</button></div>${content}${actions?`<div class="dialog-actions">${actions}</div>`:''}</div>`}
function dialog(){const m=state.modal;if(!m)return '';const s=shipment();switch(m.type){
case 'guide':return modalShell('体验指南',`<p>第一版支持从登录到异常复核的完整交互体验。建议按以下顺序操作：</p><ol class="guide-list"><li><span class="guide-number">1</span>进入演示货物「SHP-2026-001」，查看预置的数量冲突和合规提醒。</li><li><span class="guide-number">2</span>点击「数量不一致」，左右切换发票与装箱单证据。</li><li><span class="guide-number">3</span>点击「修正 AI 提取」，将装箱单数量 980 改为 1000，再点击「重新检查」。</li><li><span class="guide-number">4</span>创建新货物，选择真实 PDF / 图片 / EDIFACT 文件，体验批量上传和原件预览。</li><li><span class="guide-number">5</span>试用搜索、筛选、人工复核、规则详情和删除确认。</li></ol><div class="auth-note">${ic('info','sm')} 重要：演示货物的数据是测试样例。上传的真实文件不会经过 AI 解析；不会向服务器上传，也不会自动生成虚假的字段和检查结论。</div>`,btn('close-modal','开始体验','primary','check'));
case 'delete':{const t=state.shipments.find(z=>z.id===m.id);return modalShell('删除这票货物？',`<p>你即将删除 <strong style="color:#e9f4fb">${esc(t?.id)} · ${esc(t?.name)}</strong>。这会删除与它关联的单证、提取字段、异常和处理记录。</p><div class="prototype-note">此操作在当前原型本地存储中无法撤销；正式系统还需定义服务器数据及备份的保留与清除政策。</div>`,btn('close-modal','取消')+btn('confirm-delete','确认删除','danger','trash'))}
case 'delete-doc':{const d=s?.docs.find(d=>d.id===m.id);return modalShell('移除单证？',`<p>确认移除 <strong style="color:#e6f2fc">${esc(d?.fileName)}</strong>？关联证据会被标为缺失或需重新检查。</p><div class="prototype-note">原型中的删除只影响当前浏览器的本地数据。正式系统将由后端管理权限和文件清理。</div>`,btn('close-modal','取消')+btn('confirm-delete-doc','移除单证','danger','trash'))}
case 'forgot':return modalShell('找回密码',`<p>正式版本将向已验证的邮箱发送重置邮件。当前是离线交互原型，不会发送邮件，也没有真实账户认证。</p><div class="form-row"><label>邮箱地址</label><input class="field" type="email" disabled placeholder="需要后端邮件服务"/></div>`,btn('close-modal','返回登录','primary','left'));
case 'profile-edit':{if(!s?.demo)return modalShell('编辑字段',`<p>当前新货物没有真实 AI 提取字段；请在后端接入后使用证据驱动的字段修正功能。</p>`,btn('close-modal','知道了'));const key=m.key||'quantity';const srcs=s.docs.filter(d=>d.fields&&Object.hasOwn(d.fields,key));const selected=srcs.find(d=>d.id===m.sourceId)||srcs[0];const val=selected?.fields[key]??s.profile[key]??'';return modalShell('修正提取字段',`<p>仅修改 AI 提取层数据，不会覆盖原始单证。修改后需要重新检查，系统仍保留原值和操作记录。</p><form id="editForm"><div class="form-row"><label for="sourceDoc">来源单证</label><select class="field" id="sourceDoc" name="sourceDoc" ${srcs.length?'':'disabled'}>${srcs.map(d=>`<option value="${esc(d.id)}" ${d.id===selected?.id?'selected':''}>${esc(d.fileName)}</option>`).join('')||'<option>暂无来源</option>'}</select><div class="form-hint">选择要修正的提取结果；如果两份单证实际内容冲突，单纯修改汇总字段不会消除冲突。</div></div><div class="form-row"><label for="newValue">${esc(fieldLabels[key]||key)}</label><input class="field" id="newValue" name="newValue" value="${esc(val)}" required /></div><div class="prototype-note">${ic('info','sm')} 演示货物中的字段值为模拟提取结果，可用于验证编辑、留痕与重新核验。</div><div class="dialog-actions"><button type="button" class="btn" data-act="close-modal">取消</button><button type="submit" class="btn primary">${ic('check')} 保存修正</button></div></form>`)}
case 'review':{const f=s?.findings.find(x=>x.id===m.findingId);return modalShell('记录人工复核',`<p>记录处理意见，不会自动将异常判为「已解决」。如果风险仍然存在，系统保留异常标记。</p><form id="reviewForm"><div class="form-row"><label>异常问题</label><div class="input" style="color:#a4bed0">${esc(f?.title)}</div></div><div class="form-row"><label for="reviewNote">复核说明</label><textarea class="field" id="reviewNote" rows="5" required minlength="3" placeholder="例如：已联系供应商，等待补发正确装箱单..."></textarea></div><div class="dialog-actions"><button type="button" class="btn" data-act="close-modal">取消</button><button type="submit" class="btn primary">${ic('check')} 保存复核意见</button></div></form>`)}
case 'rule-help':return modalShell('合规检查说明',`<p>首版合规预检聚焦中国出口德国的便携式可充电蓝牙音箱，围绕 RED、RoHS、电池、德国 WEEE 及 HS 风险提示。</p><div class="detail-list"><div>每条规则在正式系统中需要明确来源、版本、适用条件和证据要求。</div><div>「已提供材料」不等于产品真实合规，「证据不足」不能判为通过。</div><div>法规风险不得由大模型自由发挥，不自动给出最终法律判断。</div></div>`,btn('close-modal','了解','primary','check'));
case 'about':return modalShell('关于此原型',`<p>${esc(IS_DEMO_NOTICE)}</p><div class="detail-list"><div>登录、账号隔离均为浏览器本地体验，不是生产级身份验证。</div><div>演示案例包含人工制作的数据样例，可验证结构化核验和异常状态流转。</div><div>新上传的真实文件仅保存在当前浏览器本地，并提供原件预览，不执行外部模型推理。</div><div>正式开发时需接入真实 AI、后端数据库、私有对象存储和权限策略。</div></div>`,btn('close-modal','知道了','primary','check'));
case 'recheck-info':return modalShell('检查说明',`<p>当前只有预置演示案例支持可验证的本地数量一致性核验。其他规则仍为带明确标识的案例结果。</p><div class="prototype-note">真实上传文件的 AI 理解、法规模型与自动预检必须等待后端真实接入，原型不会伪造处理成功。</div>`,btn('close-modal','返回','primary'));
default:return ''}}
function documentPaper(d,highlight){if(d.format==='edi'){return `<pre class="edi-pre">UNB+UNOC:3+CNEXPORT+DEIMPORT+261023:0925+0001'\nUNH+1+IFTMIN:D:99B:UN'\nBGM+610+${esc(d.id)}+9'\nFTX+AAA+++${esc(d.fields?.model||'Bluetooth Speaker')}'\nQTY+12:${esc(d.fields?.quantity||'1000')}:${esc(d.fields?.unit||'PCS')}'\nLOC+11+${esc(d.fields?.destination||'DE')}'\nUNT+6+1'\nUNZ+1+0001'</pre>`}
const rows=[['Product',d.fields.product],['Model',d.fields.model],['Quantity',d.fields.quantity?`${d.fields.quantity} ${d.fields.unit||'PCS'}`:null],['Gross weight',d.fields.gross?`${d.fields.gross} kg`:null],['Origin',d.fields.origin],['Destination',d.fields.destination],['HS Code',d.fields.hs],['Battery',d.fields.battery],['Declaration',d.fields.documentType]];return `<div class="document-paper"><div class="paper-top"><strong>${esc(d.type==='商业发票'?'COMMERCIAL INVOICE':d.type==='装箱单'?'PACKING LIST':d.type==='合规材料'?'DECLARATION':'SHIPPING DOCUMENT')}</strong><small>${esc(d.fileName)}<br/>Demo source · Page 1</small></div><div style="margin-top:16px">${rows.filter(r=>r[1]).map(([key,val])=>`<div class="paper-kv ${(highlight==='quantity'&&key==='Quantity')||(highlight==='hs'&&key==='HS Code')?'highlight':''}"><span>${key}</span><span class="val">${esc(val)}</span></div>`).join('')}</div><div class="paper-note">仅用于交互评审的模拟单证排版（不是由真实 PDF 提取）。证据定位为演示字段行。</div></div>`}
function docPreviewArea(d,hl='quantity'){if(!d)return `<div class="empty"><h3>原始证据暂无来源</h3><p>请先上传并解析对应单证。</p></div>`;if(d.demo)return documentPaper(d,hl);if(d.status==='failed')return `<div class="prototype-note">上传失败，无法预览。请重新上传或重试。</div>`;const url=state.fileUrls[d.id];if(!url)return `<div class="prototype-note">${ic('clock','sm')} 正在从浏览器本地存储读取文件…</div>`;if(d.format==='image')return `<img class="preview-img" src="${esc(url)}" alt="${esc(d.fileName)} 原始预览"/>`;if(d.format==='pdf')return `<iframe class="preview-iframe" src="${esc(url)}#toolbar=1" title="PDF 原文件预览"></iframe>`;if(d.format==='edi'||d.format==='txt')return `<div class="prototype-note">${esc(d.fileName)} · 原始 EDI / 文本格式</div><pre class="edi-pre">${esc(d.fileText||'正在读取原始文本…')}</pre>`;return `<div class="prototype-note">当前浏览器不支持直接预览该类型；文件已存储在原型本地。</div>`}
function issueDrawer(s,f){const evidence=(f.evidence||[]).map(id=>s.docs.find(d=>d.id===id)).filter(Boolean);const current=evidence.find(d=>d.id===state.selectedEvidence)||evidence[0];const isQty=f.id==='f-qty';const inv=s.docs.find(d=>d.id==='doc-invoice');const pl=s.docs.find(d=>d.id==='doc-packing');return `<div class="drawer-head"><div><strong>${esc(f.title)}</strong><small>异常详情 / 原始证据 / 人工复核</small></div><button class="close" data-act="close-drawer" title="关闭">${ic('x')}</button></div><div class="drawer-content"><div class="evidence-split"><div class="evidence-side"><div class="mini-toolbar"><div class="detail-label" style="margin:0">原始证据</div><span>演示数据 · 非原始 PDF</span></div>${evidence.length?`<div class="evidence-tabs">${evidence.map(d=>`<button data-act="select-evidence" data-id="${esc(d.id)}" class="${current?.id===d.id?'active':''}">${esc(d.fileName)}</button>`).join('')}</div>`:''}${docPreviewArea(current,isQty?'quantity':'hs')}<p class="text-note">${current?'当前标记的字段行来自演示结构化数据。正式版仅在真实页码、区域可用时高亮。':'该异常缺少对应原始证据，请补充文件。'}</p></div><div class="evidence-side"><div class="detail-label">异常判断</div>${badge(f.status==='resolved'?'已解决':f.status==='reviewed'?'人工已复核 · 风险保留':'待处理',f.status==='resolved'?'good':'warn')}<p class="detail-paragraph">${esc(f.summary)}</p>${isQty?`<div class="big-compare"><div class="compare-cell"><span>商业发票 · Invoice</span><strong>${esc(inv?.fields?.quantity||'—')}</strong> <small>PCS</small></div><div class="compare-cell"><span>装箱单 · Packing List</span><strong>${esc(pl?.fields?.quantity||'—')}</strong> <small>PCS</small></div></div>`:''}<div class="detail-label" style="margin-top:24px">为什么被标记</div><p class="detail-paragraph">${isQty?'两份来源单证的数量提取值不一致。系统不会自动选择哪个值正确。需要检查原文并判断是识别错误还是真实单证冲突。':f.rule==='red'?'尚未确认适用的欧盟符合性声明材料，请补充并人工核查。':'现有数据不足以完成准确的税则归类，需要人工确认。'}</p><div class="detail-label">下一步建议</div><div class="detail-list"><div>① 核对上方原始证据、文件类型及字段值。</div><div>② AI 识别错误时修正提取值；原文件确有错误时替换单证。</div><div>③ 保存人工意见，再重新检查受影响的规则。</div></div><div style="margin-top:24px;display:flex;flex-wrap:wrap;gap:9px">${isQty?btn('edit-qty','修正 AI 提取','','edit'):''}${btn('replace-evidence','替换单证','','upload')}${btn('add-review','人工复核','','clipboard')}${btn('recheck','重新检查','primary','refresh')}</div><div class="small-divider"></div><div class="detail-label">处理记录</div>${f.notes?.length?f.notes.map(n=>`<div class="activity-entry"><strong>${esc(n.text)}</strong><small>${formatTime(n.at)} · 人工复核</small></div>`).join(''):'<p class="text-note">暂无人工处理记录</p>'}<p class="text-note">人工已复核不代表核验通过；重新检查后若冲突依然存在，异常继续保留。</p></div></div></div>`}
function ruleDrawer(s,key){const r=ruleDetails[key];const ruleStatus=key==='red'?s.docs.some(d=>d.fileName.toLowerCase().includes('doc'))?'已上传待审':'证据待补充':key==='rohs'?'材料已提供':key==='weee'?'适用性待确认':'证据不足 / 待人工核查';return `<div class="drawer-head"><div><strong>${esc(r.title)}</strong><small>法规适用范围 / 证据 / 处理建议</small></div><button class="close" data-act="close-drawer">${ic('x')}</button></div><div class="drawer-content"><div class="eyebrow" style="margin-bottom:13px">VERSIONED DEMO RULESET</div>${badge(ruleStatus,'warn')}<div class="small-divider"></div><div class="detail-label">检查目的</div><p class="detail-paragraph">${esc(r.detail)}</p><div class="detail-label">规则来源（官方）</div><div class="detail-list"><div><strong style="color:#edf7fb">${esc(r.source)}</strong><br/><a href="${r.url}" rel="noreferrer noopener" target="_blank" style="display:inline-block;margin-top:7px;color:#8ee5e7">打开官方资料 ${ic('external','sm')}</a></div><div>演示规则集版本：Demo v0.1 · 实际义务、适用日期及来源文本应在真实接入时逐项确认。</div></div><div class="detail-label" style="margin-top:24px">下一步建议</div><p class="detail-paragraph">${esc(r.recommend)}</p><div style="display:flex;gap:9px;flex-wrap:wrap">${btn('upload','补充材料','primary','plus')}${btn('add-review-rule','记录人工意见','','edit')}</div><div class="prototype-note" style="margin-top:24px">该检查是演示预检，不是具有法律效力的合规裁决。「已提供」仅指材料存在，不代表其内容真实性或适用性已确认。</div></div>`}
function profileDrawer(s){return `<div class="drawer-head"><div><strong>货物信息 · 完整字段</strong><small>统一货物信息 / 字段级复核 / 来源证据</small></div><button class="close" data-act="close-drawer">${ic('x')}</button></div><div class="drawer-content"><p class="detail-paragraph">AI 将不同文件的字段汇总到统一货物对象。此处是演示提取结果，冲突项必须根据原始单证人工复核。</p><div class="detail-list">${Object.keys(fieldLabels).map(k=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:18px"><span><span style="display:block;color:#7294ac;font-size:10px">${fieldLabels[k]}</span><strong style="font-size:12px">${esc(s.profile[k]||'未提供')}</strong></span><button class="section-link" data-act="edit-field" data-key="${k}">查看 / 编辑 ${ic('edit','sm')}</button></div>`).join('')}</div><div class="prototype-note" style="margin-top:20px">字段修改只调整结构化提取结果，原始单证内容不变，所有变更会记入操作记录。</div></div>`}
function docDrawer(s,d){return `<div class="drawer-head"><div><strong>${esc(d.fileName)}</strong><small>${esc(d.type)} · ${d.demo?'演示样例':'浏览器本地上传文件'}</small></div><button class="close" data-act="close-drawer">${ic('x')}</button></div><div class="drawer-content"><div class="mini-toolbar">${docStatus(d)}<span>${d.demo?'模拟单证字段排版':'原件预览（未 AI 解析）'}</span></div>${docPreviewArea(d)}<div class="prototype-note" style="margin-top:17px">${d.demo?'这是专为 UI 评审制作的模拟单证，不是 PDF 原件。':'这是用户真实上传的文件预览，不包含虚构的识别字段；真实 AI 解析留待后端集成。'}</div></div>`}
function activityDrawer(s){return `<div class="drawer-head"><div><strong>操作与检查记录</strong><small>已保存的修改、复核和检查行为</small></div><button class="close" data-act="close-drawer">${ic('x')}</button></div><div class="drawer-content">${s.activities?.length?s.activities.map(a=>`<div class="activity-entry"><strong>${esc(a.text)}</strong><small>${formatTime(a.at)}</small></div>`).join(''):'<p class="text-note">暂无记录</p>'}</div>`}
function drawer(){if(!state.drawer)return '';const s=shipment();if(!s)return '';let body='';const d=state.drawer;if(d.type==='issue'){const f=s.findings.find(f=>f.id===d.id);if(!f)return '';body=issueDrawer(s,f)}else if(d.type==='rule')body=ruleDrawer(s,d.id);else if(d.type==='doc'){const file=s.docs.find(x=>x.id===d.id);if(!file)return '';body=docDrawer(s,file)}else if(d.type==='profile')body=profileDrawer(s);else if(d.type==='activity')body=activityDrawer(s);return `<div class="drawer-overlay" data-act="close-drawer"></div><aside class="drawer ${d.type==='issue'?'':'narrow'}" role="dialog" aria-modal="true">${body}</aside>`}
function render(){root.innerHTML=(!state.account?auth():`<div class="app-shell">${sidebar()}<div class="main">${topbar()}${state.screen==='workspace'?workspace():listPage()}</div></div>`)+dialog()+drawer();document.title='LogiCheck AI · 交互高保真原型';}
function toast(msg,error=false){const id=uid('toast');toastRoot.insertAdjacentHTML('beforeend',`<div class="toast ${error?'error':''}" data-id="${id}">${ic(error?'alert':'checkcircle')}<div class="toast-content">${esc(msg)}</div><button data-toast-close="${id}" title="关闭">${ic('x','sm')}</button></div>`);setTimeout(()=>toastRoot.querySelector(`[data-id="${id}"]`)?.remove(),4400)}
function openShip(id){const s=state.shipments.find(x=>x.id===id);if(!s)return toast('货物不存在',true);state.activeId=id;state.screen='workspace';state.menu=null;state.search='';state.filter='all';window.scrollTo({top:0,behavior:'smooth'});render();}
function createShipment(){const seq=Math.max(0,...state.shipments.map(s=>Number((s.id.match(/\d+$/)||['0'])[0])));let id='SHP-2026-'+String(seq+1).padStart(3,'0');while(state.shipments.some(s=>s.id===id))id='SHP-2026-'+String(++seq+1).padStart(3,'0');const s={id,name:'新建货物 · 待识别',demo:false,origin:'待提取',destination:'待提取',createdAt:time(),updatedAt:time(),docs:[],profile:{},findings:[],activities:[{text:'创建货物草稿',at:time()}]};state.shipments.unshift(s);save();openShip(s.id);toast(`草稿已创建：${id}。请上传第一份单证。`)}
function openDrawer(data){state.drawer=data;state.modal=null;state.selectedEvidence=null;render();if(data.type==='doc'){const doc=shipment()?.docs.find(d=>d.id===data.id);if(doc&&!doc.demo)loadPreview(doc)}}
async function loadPreview(doc){if(state.fileUrls[doc.id])return;const blob=await idbGet(doc.id);if(!blob){if(state.drawer?.type==='doc'&&state.drawer.id===doc.id)toast('未找到本地原文件，请重新上传。',true);return;}state.fileUrls[doc.id]=URL.createObjectURL(blob);if(doc.format==='edi'||doc.format==='txt'){try{doc.fileText=(await blob.text()).slice(0,75000)}catch{}}if(state.drawer?.type==='doc'&&state.drawer.id===doc.id)render()}
function openIssue(id){const s=shipment();const f=s.findings.find(f=>f.id===id);if(!f)return;openDrawer({type:'issue',id});}
function recheck(){const s=shipment();if(!s)return;addActivity(s,'手动请求重新检查');if(!s.demo){toast('真实文件的 AI 解析和预检尚未接入。已保留资料，未生成虚假检查结果。');state.modal={type:'recheck-info'};render();return}const a=s.docs.find(d=>d.id==='doc-invoice');const b=s.docs.find(d=>d.id==='doc-packing');const f=s.findings.find(f=>f.id==='f-qty');if(!f)return;const aQty=a?.fields?.quantity,bQty=b?.fields?.quantity;
if(aQty&&bQty&&a?.status==='complete'&&b?.status==='complete'){
if(Number(aQty)===Number(bQty)&&a.fields.unit===b.fields.unit){if(f.status!=='resolved'){f.status='resolved';f.summary=`两份来源单证现均为 ${aQty} ${a.fields.unit||'PCS'}（演示数据）`;addActivity(s,'重新检查通过：发票与装箱单数量一致，数量冲突已解决');toast('重新检查通过：数量异常已解决（演示核验）')}else toast('数量字段保持一致（演示核验）');s.profile.quantity=`${aQty} ${a.fields.unit||'PCS'}`;}
else{f.status='open';f.summary=`Invoice：${aQty} ${a.fields.unit||'PCS'} · Packing List：${bQty} ${b.fields.unit||'PCS'}`;s.profile.quantity='待确认（存在冲突）';addActivity(s,'重新检查：数量冲突仍存在');toast('重新检查完成：数量冲突仍存在',true)}
}else{f.status='open';f.summary='缺少足够的已解析来源，暂无法执行数量一致性核验';s.profile.quantity='证据不足';addActivity(s,'重新检查：缺少数量比较的有效证据');toast('证据不足，不能判定数量一致',true)}
s.dirty=false;save();render()}
function deleteShip(id){const ix=state.shipments.findIndex(s=>s.id===id);if(ix<0)return;const s=state.shipments[ix];s.docs.forEach(d=>{if(!d.demo)idbDelete(d.id);if(state.fileUrls[d.id]){URL.revokeObjectURL(state.fileUrls[d.id]);delete state.fileUrls[d.id]}});state.shipments.splice(ix,1);state.modal=null;state.menu=null;if(state.activeId===id){state.screen='list';state.activeId=null}save();render();toast(`${id} 已从原型本地数据中删除`)}
function deleteDoc(id){const s=shipment();const ix=s.docs.findIndex(d=>d.id===id);if(ix<0)return;const d=s.docs[ix];if(!d.demo)idbDelete(id);if(state.fileUrls[id]){URL.revokeObjectURL(state.fileUrls[id]);delete state.fileUrls[id]}s.docs.splice(ix,1);s.dirty=true;s.findings.filter(f=>(f.evidence||[]).includes(id)&&f.status==='resolved').forEach(f=>f.status='open');addActivity(s,`移除单证 ${d.fileName}；相关检查等待重新执行`);state.modal=null;state.drawer=null;save();render();toast('单证已移除，请重新检查相关字段')}
function openChooser(mode='add'){state.fileMode=mode;chooser.value='';chooser.click()}
function fileKind(file){const name=file.name.toLowerCase();if(/\.pdf$/.test(name))return 'pdf';if(/\.(png|jpg|jpeg|webp)$/.test(name))return 'image';if(/\.(edi|edifact|txt)$/.test(name))return 'edi';return null}
async function receiveFiles(files){const s=shipment();if(!s)return;let accepted=0;let replaced=false;for(const file of files){const format=fileKind(file);if(!format){toast(`不支持的文件类型：${file.name}`,true);continue}if(file.size>15*1024*1024){toast(`${file.name} 超过原型 15MB 的单文件限制`,true);continue}if(!file.size){toast(`${file.name} 是空文件，请检查`,true);continue}let old=null;if(state.fileMode.startsWith('replace:')){old=s.docs.find(d=>d.id===state.fileMode.split(':')[1]);if(old)replaced=true}const d={id:uid('doc'),fileName:file.name,type:'待 AI 识别',format,status:'processing',demo:false,fields:{},createdAt:time(),size:file.size};try{await idbPut(d.id,file)}catch(e){d.status='failed';d.error='本地文件保存失败';toast(`无法保存 ${file.name}：${e.message}`,true)}if(old){s.docs.splice(s.docs.indexOf(old),1,d);if(!old.demo)idbDelete(old.id);addActivity(s,`替换单证 ${old.fileName} → ${file.name}；原提取字段已失效`);s.findings.forEach(f=>{if((f.evidence||[]).includes(old.id)){f.evidence=f.evidence.filter(i=>i!==old.id);f.status='open'}})}else{s.docs.push(d);addActivity(s,`上传单证 ${file.name}`)}accepted++;
setTimeout(()=>{const current=state.shipments.flatMap(s=>s.docs).find(x=>x.id===d.id);if(current&&current.status==='processing'){current.status='awaiting';save();render();toast(`${file.name} 已存入本地。真实 AI 提取尚未接入。`)}},1100+Math.random()*900);
if(state.fileMode.startsWith('replace:'))break;
}
state.fileMode='add';if(!accepted)return;if(s.demo){s.dirty=true;toast(replaced?'已替换演示单证：原提取证据失效，需重新检查':'文件已添加至演示货物；新文件不会被假装解析成功')}else{toast(`${accepted} 份文件正在接收。完成后可查看原件。`)}save();render();}
function updateExtractedField(form){const s=shipment();if(!s||!s.demo)return;const key=state.modal.key;const docId=form.elements.sourceDoc?.value;const value=form.elements.newValue.value.trim();if(!value)return toast('请输入修正后的值',true);const d=s.docs.find(d=>d.id===docId);if(!d){toast('找不到来源单证，请先选择有效来源',true);return}const prev=d.fields[key];d.fields[key]=value;s.dirty=true;if(key==='quantity'){const a=s.docs.find(x=>x.id==='doc-invoice'),b=s.docs.find(x=>x.id==='doc-packing');s.profile.quantity=a?.fields?.quantity&&b?.fields?.quantity?Number(a.fields.quantity)===Number(b.fields.quantity)?`${a.fields.quantity} ${a.fields.unit||'PCS'}（待重新检查）`:'待确认（存在冲突）':'证据不足';}else{s.profile[key]=value}addActivity(s,`人工修正提取值：${d.fileName} / ${fieldLabels[key]||key}：${prev??'未填写'} → ${value}`);state.modal=null;save();render();toast('字段修改已保存。请点击「重新检查」更新状态。')}
function recordReview(form){const s=shipment();if(!s)return;const f=s.findings.find(f=>f.id===state.modal.findingId);if(!f)return;const note=form.elements.reviewNote.value.trim();if(note.length<3)return toast('请填写具体的复核意见',true);f.notes=f.notes||[];f.notes.unshift({text:note,at:time()});f.status='reviewed';addActivity(s,`人工复核「${f.title}」：${note}`);state.modal=null;save();render();toast('人工复核意见已保存；异常风险继续保留。')}
function showRuleReview(){const s=shipment();const key=state.drawer?.id;if(!s||!s.demo)return;let f=s.findings.find(f=>f.rule===key);if(!f){f={id:uid('f'),title:`${ruleNames[key]} · 人工跟进`,kind:'rule',rule:key,severity:'warn',status:'open',summary:'材料或规则适用性待进一步确认',evidence:[],notes:[],createdAt:time()};s.findings.push(f);save()}state.modal={type:'review',findingId:f.id};state.drawer=null;render()}
function scrollToSection(id){const el=document.getElementById(id);el?.scrollIntoView({behavior:'smooth',block:'start'});if(el){el.style.borderColor='#4c9099';setTimeout(()=>{if(el)el.style.borderColor=''},1000)}}
async function handleClick(a,el){const s=shipment();switch(a){case 'toggle-theme':{applyTheme(themeMode()==='light'?'dark':'light');render();break;}
case 'list':state.screen='list';state.activeId=null;state.drawer=null;state.menu=null;render();break;
case 'workspace-nav':if(state.activeId&&s){state.screen='workspace';render()}else if(state.shipments.length)openShip(state.shipments[0].id);else toast('请先新建货物');break;
case 'new-shipment':createShipment();break;
case 'open-shipment':openShip(el.dataset.id);break;
case 'toggle-menu':state.menu=state.menu===el.dataset.id?null:el.dataset.id;render();break;
case 'ask-delete':state.modal={type:'delete',id:el.dataset.id};state.menu=null;render();break;
case 'confirm-delete':deleteShip(state.modal.id);break;
case 'upload':if(s)openChooser('add');else toast('请先进入一票货物');break;
case 'ask-delete-doc':state.modal={type:'delete-doc',id:el.dataset.id};render();break;
case 'confirm-delete-doc':deleteDoc(state.modal.id);break;
case 'retry-file':{const d=s.docs.find(d=>d.id===el.dataset.id);if(d){d.status='awaiting';d.error=null;save();render();toast('已保留文件，等待真实解析服务接入。')}}break;
case 'preview-doc':openDrawer({type:'doc',id:el.dataset.id});break;
case 'open-issue':openIssue(el.dataset.id);break;
case 'open-first-issue':if(countIssues(s))openIssue(s.findings.find(f=>f.status!=='resolved').id);else toast('暂无待处理异常');break;
case 'select-evidence':state.selectedEvidence=el.dataset.id;render();break;
case 'rule':openDrawer({type:'rule',id:el.dataset.rule});break;
case 'rule-help':state.modal={type:'rule-help'};render();break;
case 'full-profile':if(s.demo)openDrawer({type:'profile'});else toast('当前货物还没有真实 AI 提取结果');break;
case 'edit-field':state.modal={type:'profile-edit',key:el.dataset.key||'quantity'};state.drawer=null;render();break;
case 'edit-qty':state.modal={type:'profile-edit',key:'quantity',sourceId:'doc-packing'};state.drawer=null;render();break;
case 'replace-evidence':{const f=s?.findings.find(f=>f.id===state.drawer?.id);const source=(state.selectedEvidence&&s.docs.some(d=>d.id===state.selectedEvidence)?state.selectedEvidence:null)||(f?.evidence||[]).find(id=>s.docs.some(d=>d.id===id));if(!source){toast('暂无来源单证，请使用补充单证',true);openChooser('add')}else{openChooser('replace:'+source)}}break;
case 'add-review':state.modal={type:'review',findingId:state.drawer?.id};state.drawer=null;render();break;
case 'add-review-rule':showRuleReview();break;
case 'recheck':recheck();break;
case 'activity':if(s)openDrawer({type:'activity'});else toast('请先打开货物工作台');break;
case 'guide':state.modal={type:'guide'};render();break;
case 'about':state.modal={type:'about'};render();break;
case 'close-modal':case 'close-overlay':state.modal=null;render();break;
case 'close-drawer':state.drawer=null;render();break;
case 'go-docs':scrollToSection('docs');break;
case 'go-profile':scrollToSection('profile');break;
case 'go-issues':scrollToSection('issues');break;
case 'go-rules':scrollToSection('rules');break;
case 'demo-login':loadAccount('demo@logicheck.ai');toast('已进入演示体验账号');break;
case 'toggle-auth':state.authMode=state.authMode==='login'?'register':'login';render();break;
case 'forgot':state.modal={type:'forgot'};render();break;
case 'logout':state.account=null;safeSessionRemove('logicheck_account');state.shipments=[];state.screen='auth';state.activeId=null;state.drawer=null;state.modal=null;render();break;
}}

// Local file contents are kept in IndexedDB to support prototype preview after refresh.
const IDB_NAME='logicheck_preview_files_v1';
function withDB(mode,fn){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('当前浏览器不支持本地文件存储'));const rq=indexedDB.open(IDB_NAME,1);rq.onupgradeneeded=()=>{if(!rq.result.objectStoreNames.contains('files'))rq.result.createObjectStore('files')};rq.onerror=()=>reject(rq.error);rq.onsuccess=()=>{const db=rq.result;let tx;try{tx=db.transaction('files',mode)}catch(err){db.close();return reject(err)}const q=fn(tx.objectStore('files'));q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);tx.oncomplete=()=>db.close();tx.onerror=()=>{db.close();reject(tx.error)}}})}
const idbPut=(id,blob)=>withDB('readwrite',s=>s.put(blob,id));
const idbGet=id=>withDB('readonly',s=>s.get(id));
const idbDelete=id=>withDB('readwrite',s=>s.delete(id)).catch(()=>{});

document.addEventListener('click',e=>{const clos=e.target.closest('[data-toast-close]');if(clos){toastRoot.querySelector(`[data-id="${clos.dataset.toastClose}"]`)?.remove();return}const btn=e.target.closest('[data-act]');if(btn){e.preventDefault();handleClick(btn.dataset.act,btn)}});
document.addEventListener('submit',e=>{if(!['authForm','editForm','reviewForm'].includes(e.target.id))return;e.preventDefault();if(e.target.id==='authForm'){const email=e.target.elements.email.value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email))return toast('请填写有效的邮箱地址',true);loadAccount(email);toast('已进入本地原型身份。请勿用于真实业务身份验证。')}if(e.target.id==='editForm')updateExtractedField(e.target);if(e.target.id==='reviewForm')recordReview(e.target)});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;const rows=document.getElementById('shipRows');if(rows)rows.innerHTML=renderRows()}});
document.addEventListener('change',e=>{if(e.target.id==='statusFilter'){state.filter=e.target.value;const rows=document.getElementById('shipRows');if(rows)rows.innerHTML=renderRows()}if(e.target.id==='sourceDoc'){const s=shipment(),key=state.modal?.key;const d=s?.docs.find(x=>x.id===e.target.value);const input=document.getElementById('newValue');if(input)input.value=d?.fields?.[key]||''}if(e.target.id==='fileChooser'){receiveFiles(Array.from(e.target.files||[]))}});
document.addEventListener('dragover',e=>{const zone=e.target.closest('.upload-zone');if(zone){e.preventDefault();zone.classList.add('drag')}});
document.addEventListener('dragleave',e=>{const zone=e.target.closest('.upload-zone');if(zone)zone.classList.remove('drag')});
document.addEventListener('drop',e=>{const zone=e.target.closest('.upload-zone');if(zone){e.preventDefault();zone.classList.remove('drag');receiveFiles(Array.from(e.dataTransfer.files||[]))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal){state.modal=null;render()}else if(state.drawer){state.drawer=null;render()}}if((e.key==='Enter'||e.key===' ')&&document.activeElement?.classList.contains('upload-zone')){e.preventDefault();openChooser('add')}});
if(state.account)loadAccount(state.account);else render();
})();
</script>
